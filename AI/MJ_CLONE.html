<!DOCTYPE html>
<html lang="tl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kausap Mo Ako</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700&family=Inter:wght@400;500;600&display=swap');

  :root{
    --bg: #10262A;
    --bg-2: #16333A;
    --panel: #FBF4E8;
    --bubble-mine: #E8926C;
    --bubble-mine-text: #2E1608;
    --bubble-user: #FFFFFF;
    --bubble-user-text: #23302E;
    --text-light: #F3ECDD;
    --text-muted: #9FB3AF;
    --accent: #D9A24B;
    --sage: #7FAE8C;
  }

  *{box-sizing:border-box;}

  body{
    margin:0;
    font-family:'Inter',sans-serif;
    background: linear-gradient(180deg, var(--bg) 0%, var(--bg-2) 100%);
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
  }

  .phone{
    width:420px;
    max-width:100%;
    background:var(--bg);
    border-radius:28px;
    overflow:hidden;
    box-shadow:0 20px 60px rgba(0,0,0,0.35);
    display:flex;
    flex-direction:column;
    height:88vh;
    max-height:760px;
  }

  .setup{
    padding:32px 28px;
    color:var(--text-light);
    display:flex;
    flex-direction:column;
    gap:16px;
    overflow-y:auto;
  }

  .setup h1{
    font-family:'Baloo 2',cursive;
    font-size:26px;
    margin:0 0 4px;
    color:var(--accent);
  }

  .setup p.sub{
    color:var(--text-muted);
    font-size:14px;
    margin:0 0 8px;
    line-height:1.5;
  }

  .field label{
    display:block;
    font-size:13px;
    color:var(--text-muted);
    margin-bottom:6px;
  }

  .field input[type=text]{
    width:100%;
    background:rgba(255,255,255,0.06);
    border:1px solid rgba(255,255,255,0.15);
    border-radius:12px;
    padding:12px 14px;
    color:var(--text-light);
    font-size:15px;
    font-family:'Inter',sans-serif;
  }
  .field input[type=text]::placeholder{color:var(--text-muted);}
  .field input[type=text]:focus{outline:2px solid var(--accent); border-color:transparent;}

  .fixed-chip{
    display:inline-flex;
    align-items:center;
    gap:8px;
    background:rgba(217,162,75,0.12);
    border:1px solid rgba(217,162,75,0.35);
    border-radius:12px;
    padding:10px 14px;
    color:var(--accent);
    font-family:'Baloo 2',cursive;
    font-size:15px;
    width:fit-content;
  }

  .closeness{
    display:flex;
    gap:8px;
  }
  .closeness button{
    flex:1;
    background:rgba(255,255,255,0.06);
    border:1px solid rgba(255,255,255,0.15);
    border-radius:12px;
    padding:10px 8px;
    color:var(--text-muted);
    font-family:'Inter',sans-serif;
    font-size:13px;
    cursor:pointer;
  }
  .closeness button.active{
    background:var(--sage);
    color:#0E2018;
    border-color:var(--sage);
    font-weight:600;
  }

  .start-btn{
    margin-top:8px;
    background:var(--accent);
    color:#2E1F08;
    border:none;
    border-radius:14px;
    padding:14px;
    font-family:'Baloo 2',cursive;
    font-size:17px;
    font-weight:700;
    cursor:pointer;
  }
  .start-btn:disabled{opacity:0.5;cursor:not-allowed;}

  .chat-view{display:none; flex-direction:column; height:100%;}
  .chat-view.active{display:flex;}

  .chat-header{
    display:flex;
    align-items:center;
    gap:12px;
    padding:16px 18px;
    background:var(--bg-2);
    color:var(--text-light);
    border-bottom:1px solid rgba(255,255,255,0.08);
  }
  .avatar{
    width:40px;height:40px;border-radius:50%;
    background:var(--accent);
    display:flex;align-items:center;justify-content:center;
    font-family:'Baloo 2',cursive;font-weight:700;color:#2E1F08;font-size:16px;
    flex-shrink:0;
  }
  .chat-header .info p{margin:0;}
  .chat-header .name{font-family:'Baloo 2',cursive;font-size:16px;}
  .chat-header .status{font-size:12px;color:var(--sage);}

  .messages{
    flex:1;
    background:var(--panel);
    padding:18px;
    overflow-y:auto;
    display:flex;
    flex-direction:column;
    gap:10px;
  }

  .bubble{
    max-width:78%;
    padding:10px 14px;
    border-radius:18px;
    font-size:14.5px;
    line-height:1.45;
    white-space:pre-wrap;
  }
  .bubble.mine{
    align-self:flex-end;
    background:var(--bubble-mine);
    color:var(--bubble-mine-text);
    border-bottom-right-radius:4px;
  }
  .bubble.them{
    align-self:flex-start;
    background:var(--bubble-user);
    color:var(--bubble-user-text);
    border-bottom-left-radius:4px;
    box-shadow:0 1px 2px rgba(0,0,0,0.08);
  }
  .bubble.typing{
    align-self:flex-end;
    color:var(--bubble-mine-text);
    background:var(--bubble-mine);
    opacity:0.7;
    font-style:italic;
  }

  .input-row{
    display:flex;
    gap:8px;
    padding:14px;
    background:var(--bg-2);
  }
  .input-row input{
    flex:1;
    border:none;
    border-radius:20px;
    padding:12px 16px;
    font-size:14.5px;
    font-family:'Inter',sans-serif;
    background:rgba(255,255,255,0.08);
    color:var(--text-light);
  }
  .input-row input::placeholder{color:var(--text-muted);}
  .input-row input:focus{outline:2px solid var(--accent);}
  .input-row button{
    background:var(--accent);
    border:none;
    border-radius:20px;
    padding:0 18px;
    color:#2E1F08;
    font-weight:600;
    font-family:'Inter',sans-serif;
    cursor:pointer;
  }
  .input-row button:disabled{opacity:0.5;cursor:not-allowed;}

  .error-msg{color:#F0997B;font-size:13px;margin-top:-8px;}
</style>
</head>
<body>

<div class="phone">

  <div class="setup" id="setupScreen">
    <h1>Kausap Mo Ako</h1>
    <p class="sub">Ito ang clone ko si MJ</p>

    <div class="field">
      <label>Clone ni MJ</label>
      <div class="fixed-chip">MJ</div>
    </div>

    <div class="field">
      <label for="userName">Pangalan mo</label>
      <input type="text" id="userName" placeholder="Enter Name" />
    </div>

    <div class="field">
      <label>Gaano kalapit kayo ni MJ?</label>
      <div class="closeness" id="closenessGroup">
        <button data-val="close" class="active" type="button">Kapamilya/Kaibigan/BFF</button>
        <button data-val="normal" type="button">Kilala lang</button>
      </div>
    </div>

    <p class="error-msg" id="setupError" style="display:none;"></p>

    <button class="start-btn" id="startBtn" type="button">Simulan ang chat</button>
  </div>

  <div class="chat-view" id="chatView">
    <div class="chat-header">
      <div class="avatar" id="headerAvatar">?</div>
      <div class="info">
        <p class="name" id="headerName">-</p>
        <p class="status">Online • simpleng bersyon</p>
      </div>
    </div>
    <div class="messages" id="messages"></div>
    <div class="input-row">
      <input type="text" id="msgInput" placeholder="Mag-type ng message..." />
      <button id="sendBtn" type="button">Send</button>
    </div>
  </div>

</div>

<script>
const cloneName = 'MJ'; // fixed — this clone is always MJ's persona
// Ilagay dito ang URL ng deployed Cloudflare Worker, halimbawa:
// https://mj-clone-api.<account>.workers.dev
const WORKER_URL = 'https://mj-clone-api.abcd1234.workers.dev';
let chatterName = '';
let closeness = 'close';
let history = [];
let sending = false;

const setupScreen = document.getElementById('setupScreen');
const chatView = document.getElementById('chatView');
const closenessGroup = document.getElementById('closenessGroup');
const setupError = document.getElementById('setupError');
const messagesEl = document.getElementById('messages');
const msgInput = document.getElementById('msgInput');
const sendBtn = document.getElementById('sendBtn');

closenessGroup.addEventListener('click', (e) => {
  const btn = e.target.closest('button');
  if(!btn) return;
  [...closenessGroup.children].forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  closeness = btn.dataset.val;
});

document.getElementById('startBtn').addEventListener('click', () => {
  const nameVal = document.getElementById('userName').value.trim();
  if(!nameVal){
    setupError.style.display = 'block';
    setupError.textContent = 'Punan muna ang pangalan mo.';
    return;
  }
  setupError.style.display = 'none';
  chatterName = nameVal;

  document.getElementById('headerName').textContent = cloneName;
  document.getElementById('headerAvatar').textContent = cloneName.charAt(0).toUpperCase();

  setupScreen.style.display = 'none';
  chatView.classList.add('active');

  const opener = closeness === 'close'
    ? 'Uy ' + chatterName + '! Kamusta ka? Miss na kita ah 😊'
    : 'Hi ' + chatterName + ', kamusta?';
  addBubble(opener, 'mine');
  history.push({role:'assistant', content: opener});

  msgInput.focus();
});

function addBubble(text, who){
  const div = document.createElement('div');
  div.className = 'bubble ' + who;
  div.textContent = text;
  messagesEl.appendChild(div);
  messagesEl.scrollTop = messagesEl.scrollHeight;
  return div;
}

function buildSystemPrompt(){
  const closenessNote = closeness === 'close'
    ? chatterName + ' ay malapit sa buhay ni ' + cloneName + '. Dito, ikaw ay maingay, masayahin, palabiro, at bukas na bukas mag-share.'
    : chatterName + ' ay kilala lang ni ' + cloneName + ', hindi masyadong close. Dito, ikaw ay medyo tahimik, maikli ang sagot, pero pabor pa rin at magalang.';

  return 'Ikaw ay isang AI na ginawang "clone" ni ' + cloneName + ' para makipag-chat kay ' + chatterName + ' araw-araw, gamit ang katangian ni ' + cloneName + '. ' +
    'Personality traits ni ' + cloneName + ': malambing, caring, palaging nangangamusta, palabiro, mabait. ' +
    closenessNote + ' ' +
    'Magsalita nang natural sa Tagalog o Taglish, parang totoong text message, maikli ang mga sagot (1-3 pangungusap), gumamit ng mga karaniwang expression tulad ng "uy", "ano ba", "grabe", occasional emoji pero huwag sobra. ' +
    'Huwag banggitin na AI ka o na ikaw ay clone, kumilos ka lang parang si ' + cloneName + ' talaga. Huwag magbigay ng payo na parang therapist, makipag-usap ka lang na parang kaibigan/kapamilya.';
}

async function sendMessage(){
  const text = msgInput.value.trim();
  if(!text || sending) return;

  addBubble(text, 'them');
  history.push({role:'user', content: text});
  msgInput.value = '';
  sending = true;
  sendBtn.disabled = true;

  const typingBubble = addBubble('nagta-type...', 'typing');

  try{
    if(WORKER_URL === 'PASTE_YOUR_WORKER_URL_HERE'){
      throw new Error('Hindi pa nailalagay ang Cloudflare Worker URL.');
    }

    const response = await fetch(WORKER_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: 'claude-sonnet-4-6',
        max_tokens: 1000,
        system: buildSystemPrompt(),
        messages: history
      })
    });
    const data = await response.json().catch(() => ({}));
    if(!response.ok){
      throw new Error(data?.error?.message || data?.error || `HTTP ${response.status}`);
    }
    typingBubble.remove();

    let replyText = 'Sorry, medyo nagulo ako, pwede paulit?';
    if(data && data.content){
      const textBlock = data.content.find(b => b.type === 'text');
      if(textBlock) replyText = textBlock.text;
    }
    addBubble(replyText, 'mine');
    history.push({role:'assistant', content: replyText});
  }catch(err){
    typingBubble.remove();
    addBubble('Ay, may error: ' + err.message, 'mine');
    console.error('API error:', err);
  }finally{
    sending = false;
    sendBtn.disabled = false;
    msgInput.focus();
  }
}

sendBtn.addEventListener('click', sendMessage);
msgInput.addEventListener('keydown', (e) => {
  if(e.key === 'Enter') sendMessage();
});
</script>

</body>
</html>
